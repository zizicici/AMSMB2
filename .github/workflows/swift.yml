# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # Package.swift compiles Dependencies/libsmb2 directly.
        submodules: recursive
    - name: Build
      run: swift build
    - name: Test
      # Server-dependent tests skip themselves without SMB_SERVER/SMB_SHARE.
      run: swift test

  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    # Same image as the Dockerfile / 'make cleanlinuxtest'.
    container: swift:6.1
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build
      run: swift build
    - name: Test
      run: swift test

  asan:
    name: Memory-sanitized tests (macOS)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Test with AddressSanitizer
      # The lifetime/regression suites reproduce the heap-use-after-free
      # regressions this fork guards against; they only abort under ASan.
      run: >
        swift test --sanitize=address
        --filter "SMB2LifetimeTests|SMB2RegressionTests|SMB2FileStatTests|SMB2TimestampTests"

  watchos:
    name: Build only (watchOS, incl. arm64_32)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build
      # The device destination is the one that carries the arm64_32 slice
      # (32-bit time_t/Int); the simulator is plain arm64 and would not
      # catch width traps. SwiftPM's own --destination takes a file path,
      # so this has to go through xcodebuild.
      run: >
        xcodebuild -scheme AMSMB2
        -destination 'generic/platform=watchOS'
        CODE_SIGNING_ALLOWED=NO build

  maccatalyst:
    name: Build only (macCatalyst)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Build
      run: >
        xcodebuild -scheme AMSMB2
        -destination 'generic/platform=macOS,variant=Mac Catalyst'
        CODE_SIGNING_ALLOWED=NO build
